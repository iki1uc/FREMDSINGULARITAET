<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SAFE:EVAL</title>
  <style>
    body { background:#000; color:#0f0; font-family: monospace; padding:20px; }
    .box { border:1px solid #0f0; padding:10px; margin-bottom:20px; }
  </style>
</head>
<body>

<h1>SAFE:EVAL</h1>

<div class="box" id="eval"></div>

<script>
function readCookies() {
  const raw = document.cookie;
  if (!raw) return {};
  const out = {};
  raw.split(";").map(c => c.trim()).forEach(c => {
    const [k, ...v] = c.split("=");
    out[k] = v.join("=");
  });
  return out;
}

function evalCookies() {
  const box = document.getElementById("eval");
  const data = readCookies();

  if (Object.keys(data).length === 0) {
    box.innerHTML = "Keine Cookies vorhanden.";
    return;
  }

  let html = "<ul>";
  for (const key in data) {
    html += `
      <li>
        <strong>${key}</strong>:  
        könnte als Session, Identifikator oder Nutzerzustand dienen.
      </li>
    `;
  }
  html += "</ul>";

  box.innerHTML = html;
}

window.onload = evalCookies;
</script>

</body>
</html>
