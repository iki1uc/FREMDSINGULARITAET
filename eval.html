1<!DOCTYPE html>
<html>
<body style="background:black;color:#0f0;font-family:monospace;padding:20px">
<h1>EVAL</h1>
<p>Interpretation der Cookies:</p>
<pre id="out"></pre>
<p><a href="index.html" style="color:#0f0">zurück zum Cube</a></p>
<script>
const raw = document.cookie;
let out = "";
if (!raw) {
  out = "Keine Cookies vorhanden.";
} else {
  raw.split(";").forEach(c => {
    const [k,v] = c.trim().split("=");
    out += `${k}: könnte ID / Session / Präferenz sein\n`;
  });
}
document.getElementById("out").textContent = out;
</script>
</body>
</html>
